# Чистая SPA-раздача: статика из /usr/share/nginx/html + SPA-fallback на
# index.html для любых неизвестных путей (Angular Router возьмёт их на себя).
# Никаких api-проксей здесь нет — API_BASE_URL задаётся через brand.json и
# указывает на абсолютный URL backend'a, либо на `/api/v1` — тогда фронт
# должен жить за общим reverse-proxy.

# Единственное исключение из «никаких проксей» — SDK Telegram Mini App, см.
# location = /js/telegram-web-app.js ниже. resolver обязателен: без него
# литеральный хост в proxy_pass резолвится один раз при старте, nginx залипает
# на устаревшем IP, а при недоступном DNS падает с [emerg] host not found in
# upstream и уносит с собой раздачу всей статики. Обе директивы — http-контекст
# (файл инклудится штатным nginx.conf внутрь http{}).
resolver 127.0.0.11 ipv6=off valid=30s;
resolver_timeout 5s;
proxy_cache_path /var/cache/nginx/tg levels=1:2 keys_zone=tg_cache:1m max_size=16m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /assets/runtime-config.js перезаписывается entrypoint'ом на каждый старт
    # контейнера — кэшировать его нельзя, иначе клиент не подхватит свежий
    # brand.json. Остальная статика — с долгим Cache-Control от Angular CLI
    # (outputHashing=all).
    location = /assets/runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /assets/brand.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # SDK Telegram Mini App со своего домена: убирает зависимость Mini App от
    # доступности telegram.org у клиента (подключается из index.html).
    location = /js/telegram-web-app.js {
        # Восстанавливаем реальный адрес клиента: запрос приходит через traefik
        # и hochuplachu-frontend-front, поэтому $remote_addr — адрес соседнего
        # контейнера. Доверяем только приватным сетям, real_ip_recursive берёт
        # последний недоверенный адрес — подделать XFF снаружи нельзя.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Именно $remote_addr, а не $proxy_add_x_forwarded_for: тот передал бы
        # дальше и клиентскую часть цепочки, которую клиент подделывает сам, и
        # внутренние адреса контейнеров.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Хост через переменную — единственный способ включить рантайм-ресолв.
        # URI после переменной обязателен: без него апстриму уходит исходный
        # request_uri клиента, а не путь telegram.org.
        set $tg_upstream https://telegram.org;
        proxy_pass $tg_upstream/js/telegram-web-app.js;

        proxy_ssl_server_name on;
        proxy_ssl_name telegram.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_set_header Host telegram.org;
        # telegram.org не отдаёт Vary, а ключ кеша не учитывает Accept-Encoding —
        # без этого клиент без gzip может получить из кеша сжатое тело.
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_cache tg_cache;
        proxy_cache_key "https://telegram.org/js/telegram-web-app.js";
        # Без этого proxy_cache_valid игнорируется: telegram.org шлёт max-age=345600.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        proxy_hide_header Expires;
        proxy_hide_header Cache-Control;
        expires 1h;
        add_header X-Tg-Cache $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip — небольшие текстовые ресурсы. Бинарные JS уже сжаты builder'ом.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
