  <style id="critical-splash-styles">
    html,
    body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
    }

    
    html:not(.app-ready) app-root {
      visibility: hidden;
    }

    
    html.app-ready app-root {
      visibility: visible;
    }

    #app-splash {
      position: fixed;
      inset: 0;

      z-index: 100000;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: #f8f9fa;

      
      width: 100%;
      height: 100%;

      overflow: hidden;

      
      transform: translateZ(0);
      -webkit-transform: translateZ(0);

      
      opacity: 1;

      transition:
        opacity .35s ease;

      pointer-events: auto;
    }

    
    html.app-ready #app-splash {
      opacity: 0;
      pointer-events: none;
    }

    #app-splash__center {
      position: relative;
      z-index: 1;

      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 46px;
    }

    #app-splash__logo {
      display: block;

      width: 200px;
      height: 60px;

      margin: 0;
      padding: 0;

      object-fit: contain;

      
      aspect-ratio: 10 / 3;

      
      fetchpriority: high;
    }

    #app-splash__spinner {
      width: 62px;
      height: 62px;

      flex: 0 0 auto;

      border:
        3px solid rgba(33, 37, 41, .10);

      border-top-color:
        rgba(255, 186, 38, 1);

      border-radius: 50%;

      animation:
        app-splash-spin .9s linear infinite;

      
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    @keyframes app-splash-spin {
      to {
        transform:
          translateZ(0)
          rotate(360deg);
      }
    }

    #app-splash__paw {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 320px;
      height: auto;

      transform: translateX(-50%);

      pointer-events: none;

      user-select: none;
    }

    @media (min-width: 1024px) {
      #app-splash__logo {
        width: 400px;
        height: 120px;
      }

      #app-splash__center {
        gap: 50px;
      }

      #app-splash__spinner {
        width: 90px;
        height: 90px;
      }

      #app-splash__paw {
        width: 600px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-splash__spinner {
        animation: none;
      }

      #app-splash {
        transition: none;
      }
    }
  </style>

  
  <script src="/assets/runtime-config.js"></script>

  
  <script src="/js/telegram-web-app.js"></script>
</head>
